---
# NovaSDR + RX-888 mk2 on a Talos node, scheduled by the extended resource
# that squat/generic-device-plugin advertises for the radio.
#
# Single container: this image carries the SDDC SoapySDR module, so
# novasdr-server opens the radio itself. No rx888_stream sidecar, no FIFO.
#
# Pre-requisites on the node holding the radio:
#   - the talos-rx-888 system extension (FX3 firmware + udev 0666 + usbfs
#     memory), so the device presents as 04b4:00f1
#   - generic-device-plugin advertising devic.es/rx-888-mk2-<serial>
apiVersion: v1
kind: Namespace
metadata:
  name: novasdr
  labels:
    # The udev rule makes the usbfs node 0666, so an unprivileged container
    # can open it once kubelet injects it. No privileged, no hostPath.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novasdr
  namespace: novasdr
  labels:
    app.kubernetes.io/name: novasdr
spec:
  replicas: 1
  # Recreate, NOT RollingUpdate. The device count is 1, so a rolling update
  # deadlocks: the new pod cannot schedule until the old one releases the
  # radio, and the old one is not torn down until the new one is Ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: novasdr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novasdr
    spec:
      # No nodeSelector and no affinity on purpose: the extended-resource
      # request below IS the scheduling constraint. The count is 0 on nodes
      # without the radio, so only the node holding it can admit this pod.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: novasdr
          # Must match ghcr.io/<owner>/<repo> published by .github/workflows.
          image: ghcr.io/ramielrowe/novasdr-rx-888:latest
          env:
            - name: RUST_LOG
              value: info
            - name: RUST_BACKTRACE
              value: "1"
          ports:
            - name: http
              containerPort: 9002
              protocol: TCP
          resources:
            limits:
              # Pins the pod to the node with the radio AND triggers kubelet
              # injection of /dev/bus/usb/BBB/DDD (rw) into this container.
              # Extended resources go under limits; requests are set to match.
              devic.es/rx-888-mk2-0009090703430c21: "1"
              memory: 4Gi
            requests:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: novasdr-config
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: novasdr
  namespace: novasdr
  labels:
    app.kubernetes.io/name: novasdr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: novasdr
  ports:
    - name: http
      port: 9002
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: novasdr-config
  namespace: novasdr
data:
  config.json: |
    {
      "server": {
        "port": 9002,
        "host": "[::]",
        "html_root": "frontend/dist/",
        "otherusers": 1,
        "threads": 0
      },
      "websdr": {
        "register_online": false,
        "name": "NovaSDR RX-888",
        "antenna": "",
        "grid_locator": "-",
        "hostname": "",
        "operator": "",
        "email": "",
        "callsign_lookup_url": "https://www.qrz.com/db/",
        "chat_enabled": true
      },
      "limits": {
        "audio": 100,
        "waterfall": 200,
        "events": 200,
        "ws_per_ip": 50
      }
    }
  receivers.json: |
    {
      "receivers": [
        {
          "id": "rx888",
          "name": "RX-888 mk2",
          "enabled": true,
          "input": {
            "sps": 4000000,
            "frequency": 4000000,
            "signal": "iq",
            "fft_size": 131072,
            "audio_sps": 12000,
            "waterfall_size": 1024,
            "waterfall_compression": "zstd",
            "audio_compression": "opus",
            "accelerator": "none",
            "smeter_offset": 0,
            "driver": {
              "kind": "soapysdr",
              "device": "driver=SDDC,index=0",
              "channel": 0,
              "format": "cf32",
              "settings": {},
              "stream_args": {}
            },
            "defaults": {
              "frequency": -1,
              "modulation": "USB",
              "squelch_enabled": false
            }
          }
        }
      ]
    }
